<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Gerald Adli — applied machine learning, data science, and research in medical imaging, precision agriculture, and wireless networks."
    />
    <title>Gerald Adli — Applied ML & Data Science</title>
    <script>
      // Apply the theme before first paint. Storage is optional.
      (() => {
        let saved;
        try {
          saved = localStorage.getItem("portfolio-theme");
        } catch {}
        document.documentElement.dataset.theme =
          saved === "dark" || saved === "light"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
